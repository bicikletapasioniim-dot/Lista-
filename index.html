<!doctype html>
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pagesat</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Pagesat">
<meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1412" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
/* Layout: phone app — month summary on top, dated obligation ledger, fixed bottom tab bar */
:root{
  --bg:#eef2f0;--surface:#ffffff;--sunk:#e4eae7;--ink:#13201c;--muted:#5a6964;--line:#d6dfdb;
  --accent:#0d6656;--accent-ink:#ffffff;
  --drita:#b57b00;--uje:#1d68b8;--paga:#6a4bbd;--sig:#1b7f93;--biz:#8a5a1c;--exp:#a9455a;
  --ok:#1c8449;--warn:#c2410c;
  --f-disp:"Familjen Grotesk",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1412;--surface:#17201d;--sunk:#1f2a26;--ink:#e5eeeb;--muted:#97a8a2;--line:#2a3733;
  --accent:#4cc1a6;--accent-ink:#06231d;
  --drita:#f2b631;--uje:#62acf2;--paga:#a891f2;--sig:#55c3d6;--biz:#d9a066;--exp:#ea8496;
  --ok:#4fca82;--warn:#f58a5f;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1412;--surface:#17201d;--sunk:#1f2a26;--ink:#e5eeeb;--muted:#97a8a2;--line:#2a3733;
  --accent:#4cc1a6;--accent-ink:#06231d;
  --drita:#f2b631;--uje:#62acf2;--paga:#a891f2;--sig:#55c3d6;--biz:#d9a066;--exp:#ea8496;
  --ok:#4fca82;--warn:#f58a5f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(86px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}
h2{font-size:17px;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mode{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.mode i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.mode.db i{background:var(--ok)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.monthnav b{font-family:var(--f-disp);font-size:18px;font-weight:600}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-size:18px;display:grid;place-items:center}
.big{font-family:var(--f-disp);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.row3{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.row3 div{background:var(--sunk);border-radius:10px;padding:8px 10px}
.row3 b{display:block;font-size:16px}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--sunk);margin-top:12px}
.bar span{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.c-drita{background:var(--drita)}.c-uje{background:var(--uje)}.c-paga{background:var(--paga)}.c-sig{background:var(--sig)}.c-exp{background:var(--exp)}.c-biz{background:var(--biz)}
.alert{border:1px solid var(--warn);color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-radius:12px;padding:10px 12px;font-size:14px;font-weight:500}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:44px 1fr auto 40px;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.date{text-align:center;line-height:1.1}
.date b{display:block;font-family:var(--f-disp);font-size:19px}
.date small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.date.late b,.date.late small{color:var(--warn)}
.itxt{min-width:0}
.itxt .t{font-weight:600;display:flex;align-items:center;gap:6px;overflow-wrap:anywhere}
.itxt .s{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.itxt a{color:var(--accent);font-weight:600;text-decoration:none;font-size:12.5px}
.amt{background:none;border:0;padding:4px 0;text-align:right;font-weight:600;font-size:15px}
.amt small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.item.done .t,.item.done .amt{color:var(--muted)}
.item.done .t span.tt{text-decoration:line-through}
.tick{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:17px;color:transparent}
.tick.on{background:var(--ok);border-color:var(--ok);color:#fff}
.proj{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:130px;margin-top:10px}
.proj div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:11px;color:var(--muted);min-width:0}
.proj .col{width:100%;max-width:38px;border-radius:6px 6px 2px 2px;background:var(--accent);opacity:.85;position:relative;overflow:hidden}
.proj .col i{position:absolute;left:0;right:0;bottom:0;background:var(--ok)}
.proj .v{font-size:10.5px;color:var(--ink);font-weight:600;white-space:nowrap}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.acc{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 14px}
.acc .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.acc .s{font-size:13px;color:var(--muted)}
.pill{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.pill.late{background:color-mix(in srgb,var(--warn) 14%,var(--surface));color:var(--warn)}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--sunk);color:var(--warn);border:1px solid var(--line)}
.btn.danger.arm{background:var(--warn);color:#fff}
.btn.sm{padding:8px 12px;font-size:13.5px;border-radius:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1 1 auto}
.empty{text-align:center;color:var(--muted);padding:18px 8px;font-size:14px}
.empty b{display:block;color:var(--ink);font-family:var(--f-disp);font-size:16px;margin-bottom:4px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
nav button{background:none;border:0;padding:6px 2px;border-radius:10px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);background:var(--sunk)}
.sheetbg{position:fixed;inset:0;background:rgba(5,12,10,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheethead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lrow{display:grid;grid-template-columns:1fr 120px auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow input{padding:8px 10px}
.wrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;overflow-wrap:anywhere}
.copy{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:2px 8px;font-size:12px;margin-left:6px}
.note{font-size:12.5px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;z-index:60;max-width:90%}
@media (max-width:380px){.row3{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.lrow{grid-template-columns:1fr 100px auto}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>
<body>

<div class="wrap" id="app"></div>
<nav id="nav"></nav>
<div id="sheetroot"></div>
<div id="toastroot"></div>

<script>
const COLS=['accounts','workers','expenses','months'];
const S={accounts:{},workers:{},expenses:{},months:{}};
let db=null,loading=false,tab='plan',sheetFn=null;
const LS='pagesat-v1';
const MUAJ=['Janar','Shkurt','Mars','Prill','Maj','Qershor','Korrik','Gusht','Shtator','Tetor','Nëntor','Dhjetor'];
const MSH=['Jan','Shk','Mar','Pri','Maj','Qer','Kor','Gus','Sht','Tet','Nën','Dhj'];
const CATN={drita:'Drita',uje:'Ujë',paga:'Paga',sig:'Sigurime',biz:'Biznesi',exp:'Të tjera'};
const BANK='https://apps.apple.com/app/id726998673';
const LINKS={drita:BANK,uje:BANK,sig:BANK,exp:BANK};
const payLabel=u=>u===BANK?'Paguaj me Credins ↗':'Paguaj online ↗';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>String(Math.round(+n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')+' L';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const today=new Date();today.setHours(0,0,0,0);
const mk=(y,m)=>y+'-'+String(m).padStart(2,'0');
const curMk=mk(today.getFullYear(),today.getMonth()+1);
let viewMk=curMk,repP='m';
const placeOf=(o,fb)=>(o.place||'').trim()||(String(o.name||'').includes('·')?String(o.name).split('·').pop().trim():'')||fb;
const shift=(k,d)=>{let [y,m]=k.split('-').map(Number);m+=d;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return mk(y,m)};
const mName=k=>{const [y,m]=k.split('-').map(Number);return MUAJ[m-1]+' '+y};
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:'';
try{const t=localStorage.getItem('pagesat-tab');if(t)tab=t}catch(e){}

/* ---------- storage ---------- */
function loadLocal(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);COLS.forEach(c=>S[c]=o[c]||{})}}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Nuk u ruajt në telefon')}}
const queue={};
function persist(col,id,obj){
  if(!db){saveLocal();return}
  const k=col+'/'+id;
  queue[k]=(queue[k]||Promise.resolve()).then(()=>obj===null?db.collection(col).doc(id).delete():db.collection(col).doc(id).set(obj))
    .catch(e=>toast(e&&e.code==='invalid_argument'?'Nuk ke leje të ndryshosh të dhënat':'Nuk u ruajt, provo përsëri'));
}
function put(col,id,obj){S[col]={...S[col],[id]:obj};render();persist(col,id,obj)}
function remove(col,id){const c={...S[col]};delete c[id];S[col]=c;render();persist(col,id,null)}
function setMonth(k,fn){const M=JSON.parse(JSON.stringify(S.months[k]||{}));M.amounts=M.amounts||{};M.paid=M.paid||{};fn(M);put('months',k,M)}

async function connect(){
  let tries=0;while(!(window.claude&&window.claude.use)&&tries<10){await new Promise(r=>setTimeout(r,300));tries++}
  if(!(window.claude&&window.claude.use))return;
  let d=null;try{d=await window.claude.use('db')}catch(e){}
  if(!d)return;
  db=d;loading=true;COLS.forEach(c=>S[c]={});render();
  const got={};
  const timer=setTimeout(()=>{if(loading){loading=false;toast('Të dhënat po vonohen, kontrollo internetin');render()}},10000);
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const o={};snap.docs.forEach(x=>o[x.id]=x.data());S[c]=o;
      if(!snap.metadata.fromCache)got[c]=1;
      if(COLS.every(k=>got[k])){loading=false;clearTimeout(timer)}
      render();
    },()=>{got[c]=1;if(COLS.every(k=>got[k])){loading=false;clearTimeout(timer)}render()});
  });
}

/* ---------- model ---------- */
function dueDate(k,day){const [y,m]=k.split('-').map(Number);const last=new Date(y,m,0).getDate();return new Date(y,m-1,Math.min(Math.max(1,parseInt(day)||1),last))}
function insAmt(w){return Math.round((+w.gross||0)*(w.rate===''||w.rate==null?27.9:+w.rate)/100)}
function itemsFor(k){
  const M=S.months[k]||{},am=M.amounts||{},pd=M.paid||{},out=[];
  const add=(key,o)=>out.push({key,...o,amount:am[key]!=null?+am[key]:o.def,custom:am[key]!=null,paid:pd[key]||null});
  for(const [id,a] of Object.entries(S.accounts)){
    const cat=a.kind==='uje'?'uje':'drita';
    add('a:'+id,{cat,title:a.name||CATN[cat],sub:CATN[cat]+(a.nr?' · '+a.nr:''),def:+a.estimate||0,due:dueDate(k,a.dueDay||25),link:a.link,ref:['accounts',id],place:placeOf(a,a.name||CATN[cat])});
  }
  for(const [id,w] of Object.entries(S.workers)){
    add('p:'+id,{cat:'paga',title:'Paga · '+(w.name||'Punëtor'),sub:w.role||'Rroga neto',def:+w.net||0,due:dueDate(k,w.payDay||5),ref:['workers',id],place:placeOf(w,'Punëtorët')});
    add('s:'+id,{cat:'sig',title:'Sigurime · '+(w.name||'Punëtor'),sub:'Kontributet ('+(w.rate===''||w.rate==null?27.9:w.rate)+'% e bruto)',def:insAmt(w),due:dueDate(k,w.insDay||20),link:w.link||LINKS.sig,ref:['workers',id],place:placeOf(w,'Punëtorët')});
  }
  for(const [id,e] of Object.entries(S.expenses)){
    add('e:'+id,{cat:e.cat==='Biznesi'?'biz':'exp',title:e.name||'Shpenzim',sub:e.cat||'Detyrim mujor',def:+e.amount||0,due:dueDate(k,e.dueDay||1),link:e.link,ref:['expenses',id],place:placeOf(e,e.name||'Të tjera')});
  }
  return out.sort((a,b)=>a.due-b.due||a.title.localeCompare(b.title));
}
const totals=its=>{const t={all:0,paid:0,cat:{}};its.forEach(i=>{t.all+=i.amount;if(i.paid)t.paid+=i.amount;t.cat[i.cat]=(t.cat[i.cat]||0)+i.amount});return t};

/* ---------- views ---------- */
const ICONS={
  plan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4M8 14h3M8 17h6"/></svg>',
  acc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M13 2.5 5 13.5h6l-1 8 8-11h-6z"/></svg>',
  wrk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.8.8 2.8 2.5 3 5.2"/></svg>',
  exp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>'
};
function renderNav(){
  const t=[['plan','Plani'],['acc','Drita & Ujë'],['wrk','Punëtorët'],['exp','Të tjera']];
  document.getElementById('nav').innerHTML=t.map(([k,l])=>`<button data-a="tab" data-v="${k}" class="${tab===k?'on':''}" aria-label="${l}">${ICONS[k]}${l}</button>`).join('');
}
function header(title){
  return `<div class="top"><h1>${title}</h1><button class="btn ghost sm" data-a="backup">Kopja</button></div>`;
}
function viewPlan(){
  const its=itemsFor(viewMk),t=totals(its),rem=t.all-t.paid;
  const late=its.filter(i=>!i.paid&&i.due<today);
  const order=['drita','uje','paga','sig','biz','exp'];
  const bar=t.all?order.filter(c=>t.cat[c]).map(c=>`<span class="c-${c}" style="width:${(t.cat[c]/t.all*100).toFixed(2)}%"></span>`).join(''):'';
  const legend=order.filter(c=>t.cat[c]).map(c=>`<span><i class="dot c-${c}"></i>${CATN[c]} ${fmt(t.cat[c])}</span>`).join('');
  let h=header('Pagesat');
  h+=`<section class="card"><div class="monthnav"><button class="iconbtn" data-a="mon" data-v="-1" aria-label="Muaji para">‹</button><b>${mName(viewMk)}</b><button class="iconbtn" data-a="mon" data-v="1" aria-label="Muaji tjetër">›</button></div>
  <div class="label">Mbetet për t'u paguar</div><div class="big">${fmt(rem)}</div>
  <div class="row3"><div><span class="label">Gjithsej</span><b>${fmt(t.all)}</b></div><div><span class="label">Paguar</span><b style="color:var(--ok)">${fmt(t.paid)}</b></div></div>
  ${bar?`<div class="bar">${bar}</div><div class="legend">${legend}</div>`:''}
  ${viewMk!==curMk?`<div style="margin-top:12px"><button class="btn ghost sm" data-a="mon" data-v="0">Kthehu te muaji aktual</button></div>`:''}</section>`;
  if(late.length)h+=`<div class="alert">${late.length} ${late.length===1?'pagesë e vonuar':'pagesa të vonuara'}: ${fmt(late.reduce((s,i)=>s+i.amount,0))}</div>`;
  h+=`<section class="card"><div class="sec"><h2>Plani i pagesave</h2><span class="note">${its.filter(i=>i.paid).length}/${its.length} paguar</span></div>`;
  if(loading)h+=`<div class="empty">Duke ngarkuar…</div>`;
  else if(!its.length)h+=`<div class="empty"><b>Asnjë detyrim ende</b>Shto llogaritë e dritave dhe ujit, punëtorët dhe shpenzimet e tjera. Plani mujor ndërtohet vetë.<div class="btnrow" style="margin-top:12px"><button class="btn sm" data-a="newacc" data-v="drita">+ Drita</button><button class="btn sm" data-a="newacc" data-v="uje">+ Ujë</button><button class="btn sm" data-a="newwrk">+ Punëtor</button><button class="btn sm" data-a="newrent">+ Qira</button></div></div>`;
  else h+=`<div class="list">${its.map(itemRow).join('')}</div><p class="note" style="margin:10px 0 0">Prek shumën për ta ndryshuar vetëm për këtë muaj (p.sh. sipas faturës). Shumat me “vlerësim” vijnë nga mesatarja.</p>`;
  h+=`</section>`;
  // projection
  const months=[0,1,2,3,4,5].map(d=>shift(viewMk,d)).map(k=>{const t=totals(itemsFor(k));return{k,...t}});
  const max=Math.max(1,...months.map(m=>m.all));
  const six=months.reduce((s,m)=>s+m.all,0);
  h+=`<section class="card"><div class="sec"><h2>Parashikimi 6 mujor</h2><span class="note">${fmt(six)}</span></div>
  <div class="proj">${months.map(m=>{const [y,mo]=m.k.split('-').map(Number);const hp=m.all/max*100;return `<div><span class="v">${m.all>=1000?Math.round(m.all/1000)+'k':Math.round(m.all)}</span><span class="col" style="height:${Math.max(2,hp*0.72)}%"><i style="height:${m.all?(m.paid/m.all*100):0}%"></i></span><span>${MSH[mo-1]}</span></div>`}).join('')}</div>
  <div class="legend"><span><i class="dot" style="background:var(--accent)"></i>E planifikuar</span><span><i class="dot" style="background:var(--ok)"></i>E paguar</span><span>Mesatarja mujore: ${fmt(six/6)}</span></div></section>`;
  return h+viewReport();
}
function viewReport(){
  const y=+viewMk.split('-')[0];
  const ks=repP==='y'?Array.from({length:12},(_,i)=>mk(y,i+1)):[viewMk];
  const byPlace={},byCat={},perMonth=[];let paid=0,plan=0;
  ks.forEach(k=>{let m=0;itemsFor(k).forEach(i=>{plan+=i.amount;if(!i.paid)return;paid+=i.amount;m+=i.amount;byPlace[i.place]=(byPlace[i.place]||0)+i.amount;byCat[i.cat]=(byCat[i.cat]||0)+i.amount});perMonth.push(m)});
  const places=Object.entries(byPlace).sort((a,b)=>b[1]-a[1]);
  const pmax=Math.max(1,...places.map(p=>p[1]));
  const order=['drita','uje','paga','sig','biz','exp'];
  let h=`<section class="card"><div class="sec"><h2>Shpenzimet e paguara</h2><span class="btnrow" style="flex:0 0 auto"><button class="chip ${repP==='m'?'on':''}" data-a="rep" data-v="m">${MSH[+viewMk.split('-')[1]-1]}</button><button class="chip ${repP==='y'?'on':''}" data-a="rep" data-v="y">Viti ${y}</button></span></div>
  <div class="big" style="font-size:28px">${fmt(paid)}</div><div class="note">nga ${fmt(plan)} të planifikuara ${repP==='y'?'për gjithë vitin':'këtë muaj'}</div>`;
  if(!paid)h+=`<div class="empty">Asnjë pagesë e shënuar ende. Shtyp ✓ te Plani kur të paguash dhe shpenzimet llogariten këtu.</div>`;
  else{
    if(repP==='y'){const mx=Math.max(1,...perMonth);h+=`<div class="proj" style="grid-template-columns:repeat(12,1fr);height:100px;gap:4px">${perMonth.map((v,i)=>`<div><span class="col" style="height:${Math.max(2,v/mx*80)}%;background:var(--ok)"></span><span>${MSH[i][0]}</span></div>`).join('')}</div>`}
    h+=`<div class="label" style="margin-top:14px">Sipas vendit</div><div class="stack" style="gap:8px;margin-top:8px">${places.map(([p,v])=>`<div><div style="display:flex;justify-content:space-between;gap:8px;font-size:14px"><span style="overflow-wrap:anywhere">${esc(p)}</span><b>${fmt(v)}</b></div><div class="bar" style="margin-top:4px;height:6px"><span style="width:${(v/pmax*100).toFixed(1)}%;background:var(--accent)"></span></div></div>`).join('')}</div>
    <div class="label" style="margin-top:14px">Sipas llojit</div><div class="legend">${order.filter(c=>byCat[c]).map(c=>`<span><i class="dot c-${c}"></i>${CATN[c]} ${fmt(byCat[c])}</span>`).join('')}</div>`;
  }
  return h+`</section>`;
}
function itemRow(i){

  return `<div class="item ${i.paid?'done':''}">
    <div class="date ${late?'late':''}"><b>${i.due.getDate()}</b><small>${MSH[i.due.getMonth()]}</small></div>

    ${link&&!i.paid?`<a href="${esc(link)}" target="_blank" rel="noopener">${payLabel(link)}</a>`:''}</div>
    <button class="amt" data-a="amt" data-v="${i.key}">${fmt(i.amount)}${!i.custom&&i.cat!=='paga'&&i.cat!=='sig'?'<small>vlerësim</small>':''}</button>

/* ---------- sheets ---------- */
function openSheet(fn){sheetFn=fn;drawSheet()}
function drawSheet(){const html=sheetFn();if(html==null){closeSheet();return}document.getElementById('sheetroot').innerHTML=`<div class="sheetbg" data-a="bg"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}
function closeSheet(){sheetFn=null;document.getElementById('sheetroot').innerHTML=''}
const head=(t,sub)=>`<div class="sheethead"><div><h2>${t}</h2>${sub?`<div class="note">${sub}</div>`:''}</div><button class="iconbtn" data-a="close" aria-label="Mbyll">✕</button></div>`;
function fieldHtml(f,v){
  const id='f_'+f.k;
  let inp;

  else if(f.t==='area')inp=`<textarea id="${id}" name="${f.k}" placeholder="${esc(f.p||'')}">${esc(v)}</textarea>`;

  return `<div class="field ${f.w?'':''}"><label for="${id}">${f.l}</label>${inp}${f.h?`<small>${f.h}</small>`:''}</div>`;
}
const F={

    {k:'payDay',l:'Dita e pagës',t:'num',p:'5'},{k:'insDay',l:'Afati i sigurimeve (dita)',t:'num',p:'20'},{k:'link',l:'Link për sigurimet',t:'url'},{k:'notes',l:'Shënime (NIPT, nr. personal, IBAN…)',t:'area'}],

};
let armed=null;

/* ---------- events ---------- */
function toast(m){const r=document.getElementById('toastroot');r.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2600)}
function togglePaid(k,key){setMonth(k,M=>{if(M.paid[key])delete M.paid[key];else{const d=new Date();M.paid[key]=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}})}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='bg'){if(e.target===b)closeSheet();return}
  if(a==='close')return closeSheet();
  if(a==='tab'){tab=v;try{localStorage.setItem('pagesat-tab',v)}catch(_){}window.scrollTo(0,0);return render()}
  if(a==='mon'){viewMk=v==='0'?curMk:shift(viewMk,+v);return render()}
  if(a==='rep'){repP=v;return render()}
  if(a==='pay')return togglePaid(viewMk,v);
  if(a==='paym')return togglePaid(b.dataset.k,v);
  if(a==='amt')return amtSheet(v);
  if(a==='newacc')return formSheet('accounts',uid(),{kind:v,link:LINKS[v],dueDay:25});
  if(a==='newwrk')return formSheet('workers',uid(),{rate:27.9,payDay:5,insDay:20,link:LINKS.sig});
  if(a==='newexp')return formSheet('expenses',uid(),{cat:'Tjetër',dueDay:1,link:BANK});
  if(a==='newrent')return formSheet('expenses',uid(),{cat:'Qira',name:'Qiraja',dueDay:1,link:BANK});
  if(a==='openacc')return accSheet(v);
  if(a==='openwrk')return wrkSheet(v);
  if(a==='editacc')return formSheet('accounts',v);
  if(a==='editwrk')return formSheet('workers',v);
  if(a==='editexp')return formSheet('expenses',v);
  if(a==='del'){if(armed!==v){armed=v;return drawSheet()}remove(b.dataset.col,v);armed=null;closeSheet();toast('U fshi');return}
  if(a==='copy'){const t=v;const done=()=>toast('U kopjua');const fb=()=>{const s=window.getSelection(),r=document.createRange();r.selectNodeContents(b.previousSibling||b);s.removeAllRanges();s.addRange(r);toast('Teksti u zgjodh, kopjoje')};try{navigator.clipboard.writeText(t).then(done,fb)}catch(_){fb()}return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=e.target;
  if(f.id==='form'){const col=f.dataset.col,id=f.dataset.id,o={};
    F[col].forEach(x=>{let val=f.elements[x.k].value.trim();if(x.t==='num')val=val===''?'':+val;o[x.k]=val});
    if(o.link&&!safeUrl(o.link))o.link='https://'+o.link;
    put(col,id,o);closeSheet();toast('U ruajt');return}
  if(f.id==='amtform'){const key=f.dataset.v,val=f.elements.amt.value.trim();
    setMonth(viewMk,M=>{if(val==='')delete M.amounts[key];else M.amounts[key]=+val});closeSheet();toast('U ruajt')}
});
document.addEventListener('change',e=>{
  const i=e.target;if(i.dataset.in!=='amt')return;
  const val=i.value.trim();setMonth(i.dataset.k,M=>{if(val==='')delete M.amounts[i.dataset.v];else M.amounts[i.dataset.v]=+val});
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetFn)closeSheet()});

loadLocal();render();
function backupSheet(){
  openSheet(()=>head('Kopja rezervë','Të dhënat ruhen vetëm në këtë telefon. Bëj kopje herë pas here.')+`
  <div class="card stack"><h2>Ruaj kopjen</h2><p class="note" style="margin:0">Kopjon të gjitha të dhënat si tekst. Ngjite te Shënimet (Notes) ose dërgoja vetes me email.</p><button class="btn" data-a="exp-copy">Kopjo të dhënat</button><button class="btn ghost" data-a="exp-file">Ruaj si skedar</button></div>
  <div class="card stack"><h2>Ngarko një kopje</h2><p class="note" style="margin:0">Zgjidh skedarin e kopjes (p.sh. pagesat-kopje.json) ose ngjit tekstin. Të dhënat e tanishme zëvendësohen.</p>
  <input type="file" id="f_imp" accept=".json,application/json,text/plain"><textarea id="f_imptxt" placeholder="…ose ngjit tekstin e kopjes këtu"></textarea><button class="btn" data-a="imp-txt">Ngarko tekstin</button></div>`);
}
function doImport(txt){
  let o;try{o=JSON.parse(txt)}catch(e){toast('Kopja nuk lexohet. Kontrollo që e ke ngjitur të plotë.');return}
  if(!o||typeof o!=='object'||!['accounts','workers','expenses'].some(k=>o[k])){toast('Ky skedar nuk është kopje e Pagesave.');return}
  COLS.forEach(c=>S[c]=o[c]&&typeof o[c]==='object'?o[c]:{});saveLocal();closeSheet();render();toast('Të dhënat u ngarkuan');
}
const dump=()=>JSON.stringify({app:'pagesat',v:1,...S});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
  if(a==='backup')backupSheet();
  if(a==='exp-copy'){const t=dump();try{navigator.clipboard.writeText(t).then(()=>toast('U kopjua. Ngjite te Notes.'),()=>toast('Nuk u kopjua. Provo “Ruaj si skedar”.'))}catch(_){toast('Nuk u kopjua. Provo “Ruaj si skedar”.')}}
  if(a==='exp-file'){const blob=new Blob([dump()],{type:'application/json'});const f=new File([blob],'pagesat-kopje.json',{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[f]}))navigator.share({files:[f],title:'Pagesat kopje'}).catch(()=>{});
    else{const u=URL.createObjectURL(blob);const l=document.createElement('a');l.href=u;l.download='pagesat-kopje.json';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}}
  if(a==='imp-txt'){const t=document.getElementById('f_imptxt').value.trim();if(t)doImport(t);else toast('Ngjit fillimisht tekstin e kopjes.')}
});
document.addEventListener('change',e=>{if(e.target.id==='f_imp'&&e.target.files[0]){const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(e.target.files[0])}});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
</body>
